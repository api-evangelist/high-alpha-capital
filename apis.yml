aid: high-alpha-capital
name: High Alpha Capital
description: 'High Alpha is an Indianapolis-based venture firm that creates and funds B2B SaaS
  and enterprise software companies, partnering with founders through both a venture studio that
  co-creates companies from scratch and a capital arm that invests in early-stage enterprise
  software startups. Its focus spans healthcare, sales enablement, supply chain, agtech, and
  other B2B verticals, and its portfolio and alumni include companies such as Salesloft, Attentive,
  Lessonly, Stitch, Tenon, and Liminal. High Alpha also publishes the widely referenced SaaS
  Benchmarks Report. This profile tracks the firm in the API Evangelist network; as a venture
  firm it has no public developer or API surface of its own.'
